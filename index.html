<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapPop Studio - Cute Photobooth</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CDN & Custom Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#6d5d17",
            "primary-container": "#ffe893",
            "on-primary-container": "#786720",
            "secondary": "#1b6968",
            "secondary-container": "#a5ecea",
            "on-secondary-container": "#216d6c",
            "secondary-fixed": "#a8efed",
            "tertiary": "#42682c",
            "tertiary-container": "#c8f6aa",
            "background": "#faf8ff",
            "surface": "#faf8ff",
            "surface-container": "#ebedff",
            "surface-container-high": "#e4e7fe",
            "surface-container-highest": "#dee1f8",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#171b2b",
            "on-surface-variant": "#4b4739",
            "inverse-surface": "#2c3041",
            "error": "#ba1a1a",
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #faf8ff; font-family: 'Outfit', sans-serif; }
    .sticker-shadow { box-shadow: 4px 4px 0px 0px #2c3041; }
    .sticker-shadow-sm { box-shadow: 2px 2px 0px 0px #2c3041; }
    .active-sticker-shadow:active { box-shadow: 0px 0px 0px 0px #2c3041; transform: translate(2px, 2px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
